id: 22
group: "Tra cứu & Hủy đơn"
name: "Cố hủy đơn đã APPROVED hoặc REJECTED"
description: >
  Chuẩn bị 1 đơn APPROVED, không còn PENDING → không cho hủy.

setup:
  type: approve_latest_request_for_student

turns:
  - user: "hủy đơn xin nghỉ"
    expected_bot:
      - contains: ["không có đơn", "Chờ duyệt", "hủy", "Đã hủy"]

final_check:
  expected_turn_count: 1
