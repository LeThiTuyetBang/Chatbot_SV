id: 15
group: "Nhập sai định dạng"
name: "Nhập câu linh tinh khi đang ở trong form"
description: "Hệ thống chấp nhận môn/lớp tự do; chỉ ngày sai bị chặn"

turns:
  - user: "Em muốn xin nghỉ học"
    expected_bot:
      - contains: ["mã môn"]

  - user: "hôm nay trời đẹp quá"
    expected_bot:
      - contains: ["mã môn", "mã lớp"]

  - user: "xyz linh tinh"
    expected_bot:
      - contains: ["mã lớp", "ngày"]

  - user: "abc tào lao"
    expected_bot:
      - contains: ["ngày"]

  - user: "hôm bữa"
    expected_bot:
      - contains: ["chưa hiểu ngày", "nhập lại", "ngày"]

  - user: "mai"
    expected_bot:
      - contains: ["ngày kết thúc", "lý do"]

  - user: "ngày kia"
    expected_bot:
      - contains: ["lý do", "minh chứng"]

  - user: "ốm không có minh chứng"
    expected_bot:
      - contains:
          ["Mình đã hiểu đơn của bạn như sau", "xác nhận", "ngày kết thúc"]

final_check:
  db_status: null
  expected_turn_count: 8
