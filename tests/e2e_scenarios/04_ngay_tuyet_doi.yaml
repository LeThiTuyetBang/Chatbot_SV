    actual_bot: "Ghi nhận thành công đơn xin nghỉ môn Lập trình Python từ ngày 2026-10-01 đến ngày 2026-10-03. Trạng thái hiện tại: Chờ duyệt (PENDING). Mã đơn của bạn là #4."
