id: 07
group: "Thiếu thông tin"
name: "Chỉ nói 'em xin nghỉ học' → bot hỏi lần lượt các slot"
description: "Chỉ nói 'em xin nghỉ học' → bot hỏi lần lượt các slot"

turns:
  - user: "em xin nghỉ học"
    expected_bot:
      - contains: ["mã môn hoặc tên môn"]
    actual_bot: "Bạn cho mình biết mã môn hoặc tên môn học cần xin nghỉ nhé."
    pass: true

  - user: "Cơ sở dữ liệu"
    expected_bot:
      - contains: ["mã lớp"]
    actual_bot: "Bạn cho mình biết mã lớp của bạn nhé."
    pass: true

  - user: "CN2302C"
    expected_bot:
      - contains: ["ngày bắt đầu nghỉ"]
    actual_bot: "Bạn cho mình ngày bắt đầu nghỉ nhé."
    pass: true

  - user: "mai"
    expected_bot:
      - contains: ["ngày kết thúc nghỉ"]
    actual_bot: "Bạn cho mình ngày kết thúc nghỉ nhé."
    pass: true

  - user: "ngày kia"
    expected_bot:
      - contains: ["lý do nghỉ học"]
    actual_bot: "Bạn cho mình lý do nghỉ học nhé."
    pass: true

  - user: "Ốm"
    expected_bot:
      - contains: ["link ảnh minh chứng"]
    actual_bot: "Bạn có thể gửi link ảnh minh chứng (Google Drive, Imgur...) nếu có. Nếu không có thì gõ 'không' nhé."
    pass: true

  - user: "không"
    expected_bot:
      - contains: ["Mình đã hiểu đơn của bạn như sau"]
    actual_bot: |
      Mình đã hiểu đơn của bạn như sau:
      - Môn: Cơ sở dữ liệu
      - Lớp: CN2302C
      - Từ: mai -> 2026-09-28
      - Đến: ngày kia -> 2026-09-29
      - Lý do: Ốm
      - Minh chứng: Không có

      Bạn xác nhận để mình lưu đơn nhé?
    pass: true

  - user: "đồng ý"
    expected_bot:
      - contains: ["Ghi nhận thành công", "PENDING"]
    actual_bot: "Ghi nhận thành công đơn xin nghỉ môn Cơ sở dữ liệu từ ngày 2026-09-28 đến ngày 2026-09-29. Trạng thái hiện tại: Chờ duyệt (PENDING). Mã đơn của bạn là #7."
    pass: true

final_check:
  db_status: "PENDING"
  expected_turn_count: 8

result: Pass
