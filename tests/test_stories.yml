version: "3.1"

stories:
  - story: greet and goodbye
    steps:
      - user: |
          xin chào
        intent: greet
      - action: utter_greet
      - user: |
          cảm ơn bạn
        intent: goodbye
      - action: utter_goodbye

  - story: ask absence regulation
    steps:
      - user: |
          nghỉ bao nhiêu buổi thì bị cấm thi
        intent: quy_dinh_nghi_hoc
      - action: utter_quy_dinh_nghi_hoc

  - story: e2e submit absence request week 3
    steps:
      - user: |
          em xin nghỉ học
        intent: inform_absence
      - action: utter_huong_dan_xin_nghi
      - action: absence_form
      - active_loop: absence_form
      - user: |
          Lập trình Python
        intent: cung_cap_thong_tin
      - action: absence_form
      - user: |
          DH21IT01
        intent: cung_cap_thong_tin
      - action: absence_form
      - user: |
          mai
        intent: cung_cap_thong_tin
      - action: absence_form
      - user: |
          ngày kia
        intent: cung_cap_thong_tin
      - action: absence_form
      - user: |
          em bị ốm
        intent: cung_cap_thong_tin
      - action: absence_form
      - active_loop: null
      - action: action_preview_absence_request
      - user: |
          đúng rồi
        intent: affirm
      - action: action_submit_absence_request

  - story: fallback on unclear input
    steps:
      - user: |
          abc xyz
        intent: nlu_fallback
      - action: utter_ask_rephrase