version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - nlu_fallback
  - inform_absence
  - check_absence_status
  - cancel_absence
  - cung_cap_thong_tin
  - quy_dinh_nghi_hoc

entities:
  - mssv
  - ma_lop
  - ma_mon
  - ma_mon_hoc
  - time
  - start_date
  - end_date
  - reason
  - evidence_url

actions:
  - action_preview_absence_request
  - action_submit_absence_request
  - action_reset_absence_form
  - action_check_absence_status
  - action_cancel_absence
  - action_start_absence_form
  - validate_absence_form

slots:
  time:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: time

  evidence_url:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: evidence_url
      - type: from_text
        conditions:
          - active_loop: absence_form
            requested_slot: evidence_url

  mssv:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: mssv
  ma_lop:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: ma_lop
  ma_mon:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: ma_mon
  ma_mon_hoc:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: ma_mon_hoc
      - type: from_entity
        entity: ma_mon

  start_date:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: start_date
      - type: from_entity
        entity: time
      - type: from_text
        conditions:
          - active_loop: absence_form
            requested_slot: start_date

  end_date:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: end_date
      - type: from_entity
        entity: time
      - type: from_text
        conditions:
          - active_loop: absence_form
            requested_slot: end_date

  normalized_start_date:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  normalized_end_date:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  awaiting_request_confirmation:
    type: bool
    influence_conversation: false
    mappings:
      - type: custom

  reason:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: reason
      - type: from_text
        conditions:
          - active_loop: absence_form
            requested_slot: reason

forms:
  absence_form:
    required_slots:
      - ma_mon_hoc
      - ma_lop
      - start_date
      - end_date
      - reason
      - evidence_url

responses:
  utter_ask_evidence_url:
    - text: "Bạn có thể gửi link ảnh minh chứng (Google Drive, Imgur...) nếu có. Nếu không có thì gõ 'không' nhé."

  utter_greet:
    - text: "Xin chào! Mình là chatbot hỗ trợ sinh viên. Bạn cần hỗ trợ xin nghỉ học hay tra cứu quy định vắng học?"

  utter_goodbye:
    - text: "Tạm biệt bạn! Chúc bạn học tập tốt và giữ gìn sức khỏe nhé."

  utter_huong_dan_xin_nghi:
    - text: "Để xin nghỉ học hợp lệ, bạn cần gửi đơn xin phép cho giảng viên kèm minh chứng (giấy khám bệnh, xác nhận của gia đình...). Bạn vui lòng cung cấp Mã lớp và Môn học để hệ thống ghi nhận nhé."

  utter_ask_ma_mon_hoc:
    - text: "Bạn cho mình biết mã môn hoặc tên môn học cần xin nghỉ nhé."

  utter_ask_ma_lop:
    - text: "Bạn cho mình biết mã lớp của bạn nhé."

  utter_ask_start_date:
    - text: "Bạn cho mình ngày bắt đầu nghỉ nhé."

  utter_ask_end_date:
    - text: "Bạn cho mình ngày kết thúc nghỉ nhé."

  utter_ask_reason:
    - text: "Bạn cho mình lý do nghỉ học nhé."

  utter_confirm_absence_request:
    - text: "Mình đã hiểu đơn của bạn như sau: môn {ma_mon_hoc}, lớp {ma_lop}, từ {normalized_start_date} đến {normalized_end_date}, lý do: {reason}. Bạn xác nhận để mình lưu đơn nhé?"

  utter_quy_dinh_nghi_hoc:
    - text: "Theo quy định: Sinh viên không được vắng quá 20% tổng số tiết của môn học. Nếu vắng quá 20% (dù có phép hay không phép), bạn sẽ bị cấm thi kết thúc học phần và phải học lại môn đó."

  utter_xac_nhan_thong_tin:
    - text: "Hệ thống đã nhận thông tin của bạn. Vui lòng đảm bảo bạn đã gửi minh chứng đầy đủ cho giảng viên bộ môn!"

  utter_ask_rephrase:
    - text: "Mình chưa hiểu rõ ý của bạn. Bạn có thể nói lại ngắn gọn hơn hoặc nhập theo cách khác được không?"

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: false
