version: "3.1"

rules:
  - rule: Chào hỏi
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Tạm biệt
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Hỏi quy định nghỉ học
    steps:
      - intent: quy_dinh_nghi_hoc
      - action: utter_quy_dinh_nghi_hoc

  - rule: Hướng dẫn xin nghỉ học (Tạm thời cho Tuần 2)
    steps:
      - intent: inform_absence
      - action: utter_huong_dan_xin_nghi
  - rule: Phản hồi khi sinh viên cung cấp thông tin
    steps:
      - intent: cung_cap_thong_tin
      - action: utter_xac_nhan_thong_tin
