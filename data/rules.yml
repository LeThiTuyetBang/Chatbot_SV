version: "3.1"

rules:
  - rule: Chào hỏi
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Tạm biệt
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Hỏi quy định nghỉ học
    steps:
      - intent: quy_dinh_nghi_hoc
      - action: utter_quy_dinh_nghi_hoc

  - rule: Khởi động form xin nghỉ học (inform_absence)
    steps:
      - intent: inform_absence
      - action: absence_form
      - active_loop: absence_form

  - rule: Khởi động form xin nghỉ học (cung_cap_thong_tin)
    steps:
      - intent: cung_cap_thong_tin
      - action: absence_form
      - active_loop: absence_form

  - rule: Submit form xin nghỉ học
    condition:
      - active_loop: absence_form
    steps:
      - action: absence_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_preview_absence_request

  - rule: Xác nhận lưu đơn xin nghỉ
    condition:
      - slot_was_set:
          - awaiting_request_confirmation: true
    steps:
      - intent: affirm
      - action: action_submit_absence_request

  - rule: Hủy lưu đơn xin nghỉ
    condition:
      - slot_was_set:
          - awaiting_request_confirmation: true
    steps:
      - intent: deny
      - action: action_reset_absence_form
      - action: utter_huong_dan_xin_nghi

  - rule: Fallback khi bot không hiểu
    steps:
      - intent: nlu_fallback
      - action: utter_ask_rephrase

  - rule: Tra cứu trạng thái đơn xin nghỉ
    steps:
      - intent: check_absence_status
      - action: action_check_absence_status

  - rule: Hủy đơn xin nghỉ
    steps:
      - intent: cancel_absence
      - action: action_cancel_absence
