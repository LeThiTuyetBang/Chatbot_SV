version: "3.1"

rules:
  - rule: Chào hỏi
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Tạm biệt
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Hỏi quy định nghỉ học
    steps:
      - intent: quy_dinh_nghi_hoc
      - action: utter_quy_dinh_nghi_hoc

  # 1. Kích hoạt form xin nghỉ học
  - rule: Khởi động form xin nghỉ học (inform_absence)
    condition:
      - active_loop: null
    steps:
      - intent: inform_absence
      - action: absence_form
      - active_loop: absence_form

  - rule: Khởi động form xin nghỉ học (cung_cap_thong_tin)
    condition:
      - active_loop: null
    steps:
      - intent: cung_cap_thong_tin
      - action: absence_form
      - active_loop: absence_form
  # Tiếp tục form khi user đang trả lời slot (kể cả intent inform/cung_cap)
  - rule: Tiếp tục form khi đang active và user cung cấp thông tin
    condition:
      - active_loop: absence_form
    steps:
      - or:
          - intent: cung_cap_thong_tin
          - intent: inform_absence
          - intent: nlu_fallback
      - action: absence_form
  # 2. Xử lý khi Form hoàn thành -> BẮT BUỘC gọi action_preview_absence_request
  - rule: Preview sau khi form hoàn thành (Form đang active)
    condition:
      - active_loop: absence_form
    steps:
      - action: absence_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_preview_absence_request

  - rule: Preview sau khi form hoàn thành (Form 0-turn / 1 câu đủ thông tin - inform_absence)
    condition:
      - active_loop: null
    steps:
      - intent: inform_absence
      - action: absence_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_preview_absence_request

  - rule: Preview sau khi form hoàn thành (Form 0-turn / 1 câu đủ thông tin - cung_cap_thong_tin)
    condition:
      - active_loop: null
    steps:
      - intent: cung_cap_thong_tin
      - action: absence_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_preview_absence_request

  # 3. Bước xác nhận: User đồng ý (affirm) -> Lưu đơn
  - rule: Xác nhận lưu đơn xin nghỉ (affirm)
    condition:
      - slot_was_set:
          - awaiting_request_confirmation: true
    steps:
      - intent: affirm
      - action: action_submit_absence_request

  # 4. Bước xác nhận: User nói "không" / từ chối (deny) -> Hủy không lưu
  - rule: Từ chối lưu đơn khi chờ xác nhận (deny)
    condition:
      - slot_was_set:
          - awaiting_request_confirmation: true
    steps:
      - intent: deny
      - action: action_handle_absence_correction

  # 5. Bước xác nhận: User yêu cầu sửa thông tin (sua_thong_tin / cung_cap_thong_tin)
  - rule: Chỉnh sửa thông tin đơn khi chờ xác nhận (sua_thong_tin)
    condition:
      - slot_was_set:
          - awaiting_request_confirmation: true
    steps:
      - intent: sua_thong_tin
      - action: action_handle_absence_correction

  - rule: Chỉnh sửa thông tin đơn khi chờ xác nhận (cung_cap_thong_tin)
    condition:
      - slot_was_set:
          - awaiting_request_confirmation: true
    steps:
      - intent: cung_cap_thong_tin
      - action: action_handle_absence_correction

  # 6. Bước xác nhận: User nói "hủy" / "làm lại từ đầu" (cancel_absence)
  - rule: Hủy đơn khi đang chờ xác nhận (cancel_absence)
    condition:
      - slot_was_set:
          - awaiting_request_confirmation: true
    steps:
      - intent: cancel_absence
      - action: action_handle_absence_correction

  - rule: Fallback khi bot không hiểu
    steps:
      - intent: nlu_fallback
      - action: utter_ask_rephrase

  - rule: Tra cứu trạng thái đơn xin nghỉ
    steps:
      - intent: check_absence_status
      - action: action_check_absence_status

  - rule: Hủy đơn xin nghỉ khi không ở trạng thái xác nhận
    condition:
      - active_loop: null
      - slot_was_set:
          - awaiting_request_confirmation: false
    steps:
      - intent: cancel_absence
      - action: action_cancel_absence

  - rule: Phản hồi khi đồng ý (affirm) ngoài ngữ cảnh xác nhận
    condition:
      - active_loop: null
      - slot_was_set:
          - awaiting_request_confirmation: false
    steps:
      - intent: affirm
      - action: utter_affirm_default

  - rule: Phản hồi khi từ chối (deny) ngoài ngữ cảnh xác nhận
    condition:
      - active_loop: null
      - slot_was_set:
          - awaiting_request_confirmation: false
    steps:
      - intent: deny
      - action: utter_deny_default
