version: "3.1"

stories:
  - story: Luồng hỏi đáp cơ bản
    steps:
      - intent: greet
      - action: utter_greet
      - intent: goodbye
      - action: utter_goodbye

  # Happy path 1: User nói 1 câu đủ thông tin (inform_absence)
  - story: Nộp đơn đủ thông tin 1 câu (inform_absence)
    steps:
      - intent: inform_absence
      - action: absence_form
      - active_loop: absence_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_preview_absence_request
      - slot_was_set:
          - awaiting_request_confirmation: true
      - intent: affirm
      - action: action_submit_absence_request

  # Happy path 2: User nói 1 câu đủ thông tin (cung_cap_thong_tin)
  - story: Nộp đơn đủ thông tin 1 câu (cung_cap_thong_tin)
    steps:
      - intent: cung_cap_thong_tin
      - action: absence_form
      - active_loop: absence_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_preview_absence_request
      - slot_was_set:
          - awaiting_request_confirmation: true
      - intent: affirm
      - action: action_submit_absence_request

  # Happy path 3: Form nhiều lượt (chỉ mô tả mức cao)
  - story: Nộp đơn xin nghỉ nhiều lượt
    steps:
      - intent: inform_absence
      - action: absence_form
      - active_loop: absence_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_preview_absence_request
      - slot_was_set:
          - awaiting_request_confirmation: true
      - intent: affirm
      - action: action_submit_absence_request

  # Sửa thông tin khi đang chờ xác nhận
  - story: Sửa thông tin khi chờ xác nhận
    steps:
      - intent: inform_absence
      - action: absence_form
      - active_loop: absence_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_preview_absence_request
      - slot_was_set:
          - awaiting_request_confirmation: true
      - intent: sua_thong_tin
      - action: action_handle_absence_correction
      - intent: affirm
      - action: action_submit_absence_request
