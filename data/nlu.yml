      - điều kiện để xin nghỉ học có phép
      - nghỉ học nhiều có bị cảnh báo học tập không
      - quy định vắng mặt trong buổi kiểm tra
      - vắng mặt không lý do bị phạt gì
      - nghỉ học do tai nạn xử lý thế nào
      - nghỉ có phép có bị hạ xếp loại rèn luyện không
      - quy định nghỉ học áp dụng cho lớp [DH21IT01](ma_lop)
      - được vắng tối đa bao nhiêu buổi
      - nghỉ 1 buổi có bị ảnh hưởng gì không
      - vắng thi có được thi lại không
      - làm sao biết mình đã vắng bao nhiêu tiết
      - quy định điểm danh của trường

