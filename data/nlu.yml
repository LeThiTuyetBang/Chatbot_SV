version: "3.1"

nlu:
  # --- 1. REGEX ---
  - regex: mssv
    examples: |
      - \b[0-9]{8,15}\b
      - \bSV[0-9]{6,10}\b

  - regex: ma_lop
    examples: |
      - \b[A-Za-z0-9]{2,5}-[A-Za-z0-9]{2,5}\b
      - \bDH[0-9]{2}[A-Z]{2}[0-9]{2}\b

  - regex: ma_mon
    examples: |
      - \b[A-Z]{2,4}[0-9]{3,5}\b
      - ^[A-Z]{2,4}\d{3,4}$

  - regex: time
    examples: |
      - \b\d{1,2}/\d{1,2}(?:/\d{2,4})?\b
      - \b\d{1,2}-\d{1,2}(?:-\d{2,4})?\b
      - \b(hôm nay|hôm qua|ngày mai|mai|ngày kia)\b
      - \b(thứ\s*[2-7]|chủ nhật)(?:\s*(?:tuần\s*(?:này|sau|tới)))?\b

  # --- 2. LOOKUP TABLES ---
  - lookup: ma_mon_hoc
    examples: |
      - Lập trình Python
      - Cơ sở dữ liệu
      - Mạng máy tính
      - Cấu trúc dữ liệu và giải thuật
      - Software Testing
      - Kiểm thử phần mềm
      - Trí tuệ nhân tạo
      - Hệ quản trị CSDL
      - Thực tập tốt nghiệp

  # --- 3. INTENTS ---
  # Intent Xin nghỉ học (Đã gộp inform_absence và xin_nghi_hoc)
