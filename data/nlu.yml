      - thầy ơi em xin nghỉ học lớp [IT001-M12](ma_lop)
      - em bị ốm không đi học được xin phép vắng
      - làm sao để xin vắng học có lý do
      - em xin phép vắng học ngày hôm nay
      - cô ơi em xin nghỉ buổi học chiều nay
      - mã môn [INT1339](ma_mon) em muốn xin nghỉ
      - em xin nghỉ môn [Trí tuệ nhân tạo](ma_mon_hoc) hôm nay
      - em xin nghỉ học môn [CSDL102](ma_mon)
