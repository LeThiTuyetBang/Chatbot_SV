  # Intent Xem trạng thái đơn
  - intent: check_absence_status
    examples: |
      - kiểm tra trạng thái đơn xin nghỉ
      - đơn xin nghỉ của em được duyệt chưa
      - xem lịch sử nộp đơn
      - tra cứu đơn xin nghỉ học
      - đơn nghỉ học hôm qua thế nào rồi
      - cho em xem danh sách đơn đã nộp

  # Intent Hủy đơn xin nghỉ
  - intent: cancel_absence
    examples: |
      - em muốn hủy đơn xin nghỉ
      - rút lại đơn xin nghỉ học
      - hủy giúp em cái đơn nghỉ vừa nộp
      - em đi học lại được rồi nên muốn hủy đơn
      - làm sao để hủy đơn xin nghỉ học ạ

