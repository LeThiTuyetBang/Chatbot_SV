      - cho em nghỉ học buổi tới
      - em bị bệnh nên xin nghỉ học
      - em xin nghỉ học môn [Mạng máy tính](ma_mon_hoc)
      - cho em xin nghỉ buổi học ngày mai
      - em muốn nộp đơn xin nghỉ học
