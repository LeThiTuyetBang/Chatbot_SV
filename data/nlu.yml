      - MSSV [191200123](mssv) xin nghỉ vắng hôm nay
      - xin nghỉ học môn [Software Testing](ma_mon_hoc)
      - em muốn xin vắng tiết 1 2 hôm nay
      - cho em xin nghỉ học 1 buổi
      - xin nghỉ học 2 ngày thì làm thủ tục gì
      - em bị hỏng xe không đến lớp được xin vắng
      - em xin nghỉ học buổi sáng nay
      - em muốn nghỉ học có phép
      - em xin nghỉ ngày mai
      - em xin nghỉ hôm nay
