      - em học lớp [DH21IT01](ma_lop) xin nghỉ học hôm nay
      - em muốn nộp minh chứng xin vắng buổi học
      - hôm nay em đi khám bệnh nên xin vắng mặt
      - xin phép cô cho em nghỉ môn [Mạng máy tính](ma_mon_hoc)
      - làm đơn xin vắng học ở đâu vậy bot
      - em bị tai nạn nhẹ xin nghỉ học tuần này
      - nhà em có việc đột xuất cho em xin nghỉ học
      - nghỉ học môn [Kiểm thử phần mềm](ma_mon_hoc) cần giấy tờ gì
