recipe: default.v1
assistant_id: chatbot_sv_uth

language: vi

pipeline:
  # Tiếng Việt tách bằng khoảng trắng + char n-gram vẫn hiệu quả trong Rasa OSS
  - name: WhitespaceTokenizer

  # Regex → feature cho entity (bổ sung RegexEntityExtractor)
  - name: RegexFeaturizer
    case_sensitive: false

  - name: LexicalSyntacticFeaturizer

  - name: CountVectorsFeaturizer
    analyzer: word
    min_ngram: 1
    max_ngram: 2
    oov_token: "__oov__"
    lowercase: true

  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 2
    max_ngram: 5
    lowercase: true

  - name: RegexEntityExtractor
    case_sensitive: false
    use_lookup_tables: true
    use_regexes: true
    use_word_boundaries: false # tiếng Việt / mã lớp dính chữ-số

  - name: DIETClassifier
    epochs: 100
    constrain_similarities: true
    random_seed: 42 # tái lập kết quả CV
    entity_recognition: true
    intent_classification: true
    learning_rate: 0.001

  - name: EntitySynonymMapper

  - name: ResponseSelector
    epochs: 100
    constrain_similarities: true
    random_seed: 42

  - name: FallbackClassifier
    threshold: 0.7
    ambiguity_threshold: 0.1

policies:
  - name: MemoizationPolicy
  - name: RulePolicy
  - name: TEDPolicy
    max_history: 5
    epochs: 100
    constrain_similarities: true
    random_seed: 42
